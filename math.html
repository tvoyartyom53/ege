  return raw.map(([prompt, answer], i) => ({
    id: `${prefix}-${String(i + 1).padStart(3, '0')}`,
    prompt,
    answer
  }));
}

function getProgress(subjectId, taskId) {
  try {
    const raw = localStorage.getItem(`progress:${subjectId}:${taskId}`);
    return raw ? JSON.parse(raw) : {};
  } catch { return {}; }
}
function markCard(subjectId, taskId, cardId, known) {
  const p = getProgress(subjectId, taskId);
  p[cardId] = { known, attempts: (p[cardId]?.attempts ?? 0) + 1, lastSeen: Date.now() };
  localStorage.setItem(`progress:${subjectId}:${taskId}`, JSON.stringify(p));
}
function resetProgress(subjectId, taskId) {
  localStorage.removeItem(`progress:${subjectId}:${taskId}`);
}

// ==================== УТИЛИТЫ ====================
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function getSubject(id) { return DATA.subjects.find(s => s.id === id); }
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

// ==================== ИСТОРИЯ ОТВЕТОВ ====================
function renderHistorySections(subject, task) {
  const progress = getProgress(subject.id, task.id);
  const known = [];
  const unknown = [];

  task.cards.forEach(card => {
    const p = progress[card.id];
    if (!p) return;
    const label = card.prompt;
    const answer = card.answer;
    if (p.known) known.push({ label, answer });
    else unknown.push({ label, answer });
  });

  if (known.length === 0 && unknown.length === 0) return '';

  const renderItem = (item, cls) => `
    <div class="text-xs ${cls} rounded-lg px-3 py-2 mb-2">
      <div class="font-mono text-gray-800 break-words">${esc(item.label)}</div>
      <div class="font-mono text-green-700 break-words">${esc(item.answer)}</div>
    </div>`;

  return `
    <div class="mt-8 grid gap-4 md:grid-cols-2">
      <div class="bg-white rounded-2xl shadow-sm border border-green-100 p-5">
        <h3 class="text-sm font-semibold text-green-700 mb-3">✓ Изучено (${known.length})</h3>
        ${known.length === 0
          ? '<p class="text-xs text-gray-500 italic">Пока нет</p>'
          : `<div class="space-y-2 max-h-64 overflow-y-auto">${known.map(i => renderItem(i, 'bg-green-50')).join('')}</div>`}
      </div>
      <div class="bg-white rounded-2xl shadow-sm border border-red-100 p-5">
        <h3 class="text-sm font-semibold text-red-700 mb-3">✗ Надо повторить (${unknown.length})</h3>
        ${unknown.length === 0
          ? '<p class="text-xs text-gray-500 italic">Пока нет</p>'
          : `<div class="space-y-2 max-h-64 overflow-y-auto">${unknown.map(i => renderItem(i, 'bg-red-50')).join('')}</div>`}
      </div>
    </div>`;
}

function renderTask(app, subjectId, taskId) {
  const subject = getSubject(subjectId);
  const task = subject?.tasks.find(t => t.id === taskId);
  if (!subject || !task) { location.hash = '#/'; return; }

  const key = `${subjectId}:${taskId}`;
  if (state.taskKey !== key) {
    state.taskKey = key;
    state.queue = shuffle(task.cards);
    state.index = 0; state.revealed = false; state.done = false; state.correct = 0;
  }
  if (state.done) return renderDone(app, subject, task);
  const card = state.queue[state.index];
  return renderFlashcard(app, subject, task, card);
}

function answerFlashcard(known, subject, task) {
  const card = state.queue[state.index];
  markCard(subject.id, task.id, card.id, known);
  if (known) state.correct++;
  state.revealed = false;
  if (state.index + 1 >= state.queue.length) state.done = true;
  else state.index++;
  render();
}

function renderDone(app, subject, task) {
  const progress = getProgress(subject.id, task.id);
  const unknownCount = task.cards.filter(c => !progress[c.id]?.known).length;
  app.innerHTML = `
    <a href="#/subject/${subject.id}" class="text-sm text-blue-600 hover:underline mb-4 inline-block">← К списку заданий</a>
    <div class="max-w-2xl mx-auto">

        <p class="text-gray-600 mb-6">Правильно: <span class="font-semibold text-green-700">${state.correct}</span> из <span class="font-semibold">${state.queue.length}</span></p>
        <div class="grid gap-3 md:grid-cols-2">
          <button id="btn-restart" class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-xl transition">Повторить всё</button>
          <button id="btn-unknown" ${unknownCount === 0 ? 'disabled' : ''} class="bg-yellow-100 hover:bg-yellow-200 disabled:opacity-40 disabled:cursor-not-allowed text-yellow-800 font-medium py-3 rounded-xl transition">Только неизученные (${unknownCount})</button>
        </div>
      </div>
      ${renderHistorySections(subject, task)}
    </div>`;
  document.getElementById('btn-restart').addEventListener('click', () => {
    state.queue = shuffle(task.cards);
    state.index = 0; state.revealed = false; state.done = false; state.correct = 0;
    render();
  });
  document.getElementById('btn-unknown')?.addEventListener('click', () => {
    const unknown = task.cards.filter(c => !progress[c.id]?.known);
    if (!unknown.length) return;
    state.queue = shuffle(unknown);
    state.index = 0; state.revealed = false; state.done = false; state.correct = 0;
    render();
  });
}

// ==================== НЕЙРОТЁМА ====================
const neuro = { fab: null, panel: null, messagesEl: null, inputEl: null, fileInput: null, preview: null, thumb: null, name: null, removeBtn: null, currentFile: null, initialized: false };

function initNeuro() {
  if (neuro.initialized) return;
  neuro.initialized = true;
  neuro.fab = document.getElementById('neuro-fab');
  neuro.panel = document.getElementById('neuro-panel');
  neuro.messagesEl = document.getElementById('neuro-messages');
  neuro.inputEl = document.getElementById('neuro-input');
  neuro.fileInput = document.getElementById('neuro-file-input');
  neuro.preview = document.getElementById('neuro-image-preview');
  neuro.thumb = document.getElementById('neuro-image-thumb');
  neuro.name = document.getElementById('neuro-image-name');
  neuro.removeBtn = document.getElementById('neuro-image-remove');

  neuro.fab.addEventListener('click', () => toggleNeuro());
  document.getElementById('neuro-close').addEventListener('click', () => toggleNeuro(false));

  neuro.fileInput.addEventListener('change', () => {
    const f = neuro.fileInput.files[0];
    if (!f) return;
    neuro.currentFile = f;
    neuro.thumb.src = URL.createObjectURL(f);
    neuro.name.textContent = f.name;
    neuro.preview.classList.remove('hidden');
    neuro.fileInput.value = '';
  });
  neuro.removeBtn.addEventListener('click', () => {
    neuro.currentFile = null;
    neuro.preview.classList.add('hidden');
    neuro.thumb.src = '';
  });

  document.getElementById('neuro-send').addEventListener('click', sendNeuro);
  neuro.inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendNeuro();
    }
  });
}

function toggleNeuro(show) {
  if (show === undefined) neuro.panel.classList.toggle('hidden');
  else if (show) neuro.panel.classList.remove('hidden');
  else neuro.panel.classList.add('hidden');
  if (!neuro.panel.classList.contains('hidden')) neuro.inputEl.focus();
}

function addNeuroMessage(text, role = 'user') {
  const div = document.createElement('div');
  div.className = role === 'user'
    ? 'bg-blue-100 text-blue-900 rounded-xl px-3 py-2 ml-8'
    : role === 'assistant'
      ? 'bg-white border border-gray-200 text-gray-800 rounded-xl px-3 py-2 mr-8 whitespace-pre-wrap'
      : 'text-gray-500 italic text-xs';
  div.textContent = text;
  neuro.messagesEl.appendChild(div);
  neuro.messagesEl.scrollTop = neuro.messagesEl.scrollHeight;
  return div;
}

async function sendNeuro() {
  const text = neuro.inputEl.value.trim();
  if (!text && !neuro.currentFile) return;

  const userMsg = addNeuroMessage(text || '[фото]', 'user');
  neuro.inputEl.value = '';

  if (neuro.currentFile) {
    const img = document.createElement('img');
    img.src = URL.createObjectURL(neuro.currentFile);
    img.className = 'mt-2 rounded-lg max-h-32 object-cover';
    userMsg.appendChild(img);
  }

  const fileToSend = neuro.currentFile;
  neuro.currentFile = null;
  neuro.preview.classList.add('hidden');
  neuro.thumb.src = '';

  const loading = addNeuroMessage('Нейротёма думает…', 'system');

  try {
    if (typeof puter === 'undefined') throw new Error('Puter.js не загрузился.');
    let response;
    if (fileToSend) {
      response = await puter.ai.chat(text || 'Помоги с этой задачей по математике.', fileToSend, { model: 'gpt-4o-mini' });
    } else {
      response = await puter.ai.chat(text, { model: 'gpt-4o-mini' });
    }
    loading.remove();
    let answer = '';
    if (typeof response === 'string') answer = response;
    else if (response?.message?.content) answer = response.message.content;
    else if (response?.text) answer = response.text;
    else answer = JSON.stringify(response);
    addNeuroMessage(answer, 'assistant');
  } catch (err) {
    loading.remove();
    let msg = 'Не удалось получить ответ. ';
    if (err.message && /auth|login|sign/i.test(err.message)) msg += 'Войди в аккаунт Puter.';
    else msg += err.message || 'Попробуй позже.';
    addNeuroMessage(msg, 'system');
  }
}

function attachNeuroAsk() {
  document.querySelectorAll('.neuro-ask').forEach(btn => {
    btn.addEventListener('click', () => {
      initNeuro();
      toggleNeuro(true);
      const ctx = btn.getAttribute('data-neuro-context') || '';
      neuro.inputEl.value = ctx;
      neuro.inputEl.focus();
    });
  });
}

window.addEventListener('hashchange', () => {
  const parts = parseRoute();
  const key = parts[0] === 'subject' && parts[2] ? `${parts[1]}:${parts[2]}` : null;
  if (state.taskKey && state.taskKey !== key) state.taskKey = null;
  render();
  window.scrollTo(0, 0);
});
window.addEventListener('DOMContentLoaded', () => {
  initNeuro();
  render();
});
</script>
</body>
</html>
