<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Итоговое сочинение | Тренажёр</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; height: 100vh; overflow: hidden; background: #f8fafc; margin: 0; padding: 0; }
  header { position: fixed; top: 0; left: 0; right: 0; height: 64px; z-index: 3000; background: #fff; border-bottom: 1px solid #e5e7eb; }
  .screen { display: none; position: absolute; top: 64px; bottom: 0; left: 0; right: 0; overflow-y: auto; background: #f8fafc; z-index: 10; }
  .screen.active { display: block; z-index: 20; }
  #screen-main.active, #screen-quiz-menu.active { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
  .menu-card { background: #fff; padding: 20px; border-radius: 16px; text-align: center; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.05); transition: background-color 0.2s, transform 0.1s; border: 2px solid transparent; width: 100%; display: block; margin-bottom: 16px; box-sizing: border-box; }
  .menu-card:active { transform: scale(0.98); }
  .menu-card:hover { background-color: #fdf4ff; border-color: #d946ef; }
  .option-btn { transition: all 0.15s ease; border: 2px solid #e5e7eb; background: #fff; user-select: none; }
  .option-btn.selected { background-color: #f3e8ff; border-color: #a855f7; color: #581c87; }
  .option-btn.correct { background-color: #dcfce7; border-color: #22c55e; color: #166534; pointer-events: none; }
  .option-btn.wrong { background-color: #fee2e2; border-color: #ef4444; color: #991b1b; pointer-events: none; opacity: 0.7; }
  .option-btn:disabled { cursor: not-allowed; }
</style>
</head>
<body>

<header>
  <div class="max-w-4xl mx-auto px-4 h-full flex items-center justify-between">
    <a href="index.html" class="text-xl font-bold text-fuchsia-700">✍️ Итоговое сочинение</a>
    <nav class="flex gap-4">
      <a href="index.html" class="text-sm text-gray-600 hover:text-gray-900">Главная</a>
    </nav>
  </div>
</header>

<div id="screen-main" class="screen active">
  <div class="w-full max-w-md">
    <h1 class="text-3xl font-bold text-gray-800 mb-2 text-center">✍️ Итоговое сочинение</h1>
    <p class="text-center text-gray-500 mb-8">Тренажёр литературных аргументов</p>
    <div class="flex flex-col">
      <button onclick="showScreen('screen-quiz-menu')" class="menu-card border-l-4 border-l-fuchsia-500">
        <div class="text-4xl mb-3">🎮</div>
        <h2 class="text-xl font-bold text-gray-800">Тренажёр</h2>
        <p class="text-sm text-gray-500 mt-1">Подбери 2 аргумента к теме</p>
      </button>
      <button onclick="openReference()" class="menu-card border-l-4 border-l-blue-500">
        <div class="text-4xl mb-3">📚</div>
        <h2 class="text-xl font-bold text-gray-800">Справочник</h2>
        <p class="text-sm text-gray-500 mt-1">Все аргументы и пересказы</p>
      </button>
    </div>
  </div>
</div>

<div id="screen-quiz-menu" class="screen">
  <div class="w-full max-w-md">
    <button onclick="showScreen('screen-main')" class="text-fuchsia-600 font-bold mb-6 inline-block hover:underline bg-transparent border-none cursor-pointer">← Назад</button>
    <h1 class="text-2xl font-bold text-gray-800 mb-6 text-center">Выбери раздел</h1>
    <div class="flex flex-col">
      <button onclick="startQuiz('all')" class="menu-card border-l-4 border-l-fuchsia-500">
        <h2 class="text-lg font-bold text-gray-800">Все темы (Микс)</h2>
      </button>
      <button onclick="startQuiz('1')" class="menu-card border-l-4 border-l-purple-500">
        <h2 class="text-lg font-bold text-gray-800">1. Духовно-нравственные ориентиры</h2>
      </button>
      <button onclick="startQuiz('2')" class="menu-card border-l-4 border-l-orange-500">
        <h2 class="text-lg font-bold text-gray-800">2. Семья, общество, Отечество</h2>
      </button>
      <button onclick="startQuiz('3')" class="menu-card border-l-4 border-l-emerald-500">
        <h2 class="text-lg font-bold text-gray-800">3. Природа и культура</h2>
      </button>
    </div>
  </div>
</div>

<div id="screen-quiz-play" class="screen p-4">
  <div class="max-w-2xl mx-auto w-full">
    <div class="flex justify-between items-center mb-4">
      <button onclick="showScreen('screen-quiz-menu')" class="text-gray-500 hover:text-gray-800 text-sm font-bold bg-transparent border-none cursor-pointer">← В меню</button>
      <div class="text-sm font-bold text-gray-600">Вопрос <span id="q-num">1</span></div>
    </div>
    
    <div class="bg-white rounded-2xl shadow-lg p-6 relative overflow-hidden mb-4">
      <div class="absolute top-0 left-0 h-1 bg-fuchsia-500 w-full"></div>
      <div class="text-xs text-fuchsia-600 font-bold uppercase tracking-wider mb-2">Тема сочинения</div>
      <h2 id="theme-title" class="text-xl font-bold text-gray-800 mb-6">Загрузка...</h2>
      
      <div class="text-sm text-gray-500 mb-4 font-semibold">Выбери <span class="text-fuchsia-600">2 произведения</span>, которые подходят для аргументации:</div>
      <div id="options-container" class="space-y-3"></div>
      
      <button id="btn-check" onclick="checkAnswers()" class="w-full bg-fuchsia-600 text-white font-bold py-3 rounded-xl mt-6 shadow hidden border-none cursor-pointer hover:bg-fuchsia-700 transition">
        Проверить выбор
      </button>
    </div>

    <div id="answer-block" class="hidden space-y-4">
      <h3 class="text-lg font-bold text-gray-800 mt-6 mb-2">Правильные аргументы:</h3>
      <div id="arguments-container" class="space-y-4"></div>
    </div>

    <button id="btn-next" onclick="nextQuestion()" class="w-full bg-fuchsia-600 text-white font-bold py-3 rounded-xl mt-4 shadow hidden border-none cursor-pointer hover:bg-fuchsia-700 transition mb-10">Следующая тема →</button>
  </div>
</div>

<div id="screen-ref" class="screen p-4">
  <div class="max-w-3xl mx-auto">
    <button onclick="showScreen('screen-main')" class="text-fuchsia-600 font-bold mb-6 inline-block hover:underline bg-transparent border-none cursor-pointer">← Назад</button>
    <h1 class="text-2xl font-bold text-gray-800 mb-6 text-center">📚 Справочник аргументов</h1>
    <div id="ref-content" class="space-y-6 pb-10"></div>
  </div>
</div>

<script>
const DB = [
  // ================= РАЗДЕЛ 1 =================
  { section: "1", theme: "Что значит быть честным с самим собой?", options: ["А.С. Пушкин «Капитанская дочка»", "Ф.М. Достоевский «Преступление и наказание»", "А.П. Чехов «Вишневый сад»", "М.А. Булгаков «Собачье сердце»"], correctWorks: ["А.С. Пушкин «Капитанская дочка»", "Ф.М. Достоевский «Преступление и наказание»"], arguments: { "А.С. Пушкин «Капитанская дочка»": "Петр Гринев, оказавшись в плену у Пугачева, отказывается присягать бунтовщику. Он честен перед собой и своей совестью, заявляя: «Я присягал государыне императрице: тебе служить не могу». Искренность и благородство юноши поражают Пугачева, и тот милует его. Этот пример доказывает, что честность с самим собой и верность своим принципам — это качество, которое вызывает уважение даже у врагов и помогает сохранить человеческое достоинство.", "Ф.М. Достоевский «Преступление и наказание»": "Родион Раскольников пытается обмануть свою совесть, создавая бесчеловечную теорию о «право имеющих». Он убеждает себя, что убийство старухи — это справедливость. Однако после преступления он не может жить с этим грузом, его внутренний мир разрушен. Только признавшись Соне и сдавшись полиции, он начинает путь к истине. Этот пример показывает, что быть честным с собой — значит не заглушать голос совести и уметь признавать свои ошибки." } },
  { section: "1", theme: "Может ли человек изменить свою судьбу?", options: ["А.М. Горький «Старуха Изергиль» (Легенда о Данко)", "И.С. Тургенев «Отцы и дети»", "М.А. Шолохов «Судьба человека»", "Н.В. Гоголь «Шинель»"], correctWorks: ["А.М. Горький «Старуха Изергиль» (Легенда о Данко)", "М.А. Шолохов «Судьба человека»"], arguments: { "А.М. Горький «Старуха Изергиль» (Легенда о Данко)": "Данко, выходец из бедного племени, не смирился с судьбой быть рабом в темном лесу. Он взял на себя ответственность за жизни людей, вырвал из груди пылающее сердце и осветил путь. Его поступок изменил судьбу всего племени, выведя его к свету. Этот пример доказывает, что человек способен изменить не только свою судьбу, но и судьбу окружающих, если готов на подвиг и самопожертвование.", "М.А. Шолохов «Судьба человека»": "Андрей Соколов прошел через ад Великой Отечественной войны, потерял всю семью и испытал ужасы плена. Казалось бы, судьба сломила его, но он нашел в себе силы не озлобиться. Он усыновил мальчика-сироту Ваню, подарив ему надежду на будущее. Этот пример показывает, что даже в самых страшных обстоятельствах человек может выбрать свой путь и изменить судьбу, проявив силу духа и сострадание." } },
  { section: "1", theme: "В чём разница между мечтой и иллюзией?", options: ["И.А. Гончаров «Обломов»", "А.С. Пушкин «Евгений Онегин»", "М.Ю. Лермонтов «Герой нашего времени»", "А.Н. Островский «Гроза»"], correctWorks: ["И.А. Гончаров «Обломов»", "А.Н. Островский «Гроза»"], arguments: { "И.А. Гончаров «Обломов»": "Илья Обломов живет в мире грез о прекрасном будущем в Обломовке, но ничего не делает для его достижения. Он строит планы, но на деле предпочитает лежать на диване. Его мечта об идеальной жизни превращается в иллюзию, заслоняющую реальность, в то время как его друг Штольц живет реальными делами. Пример Обломова учит нас, что иллюзия — это пассивная мечта, оторванная от действий и ведущая к деградации личности.", "А.Н. Островский «Гроза»": "Катерина мечтает о свободе, настоящей любви и полете, как птица. Однако она живет в доме Кабанихи, где царит «темное царство» и лицемерие. Ее мечты — это искренний порыв души, но суровая реальность делает их иллюзией, несовместимой с жизнью. Трагедия героини показывает, что иногда мечта становится опасной иллюзией, если реальность не оставляет шанса на ее воплощение." } },
  { section: "1", theme: "Что такое настоящая дружба?", options: ["Л.Н. Толстой «Война и мир»", "А.С. Пушкин «Евгений Онегин»", "И.А. Гончаров «Обломов»", "А.П. Чехов «Вишневый сад»"], correctWorks: ["Л.Н. Толстой «Война и мир»", "А.С. Пушкин «Евгений Онегин»"], arguments: { "Л.Н. Толстой «Война и мир»": "Андрей Болконский и Пьер Безухов — пример настоящей дружбы. Они поддерживают друг друга в самые трудные минуты: Пьер помогает Андрею пережить смерть жены, а Андрей поддерживает Пьера в момент его духовного кризиса. Их дружба основана на доверии, честности и общих духовных ценностях, а не на корысти. Это доказывает, что настоящий друг — это тот, кто готов выслушать и поддержать в любой ситуации.", "А.С. Пушкин «Евгений Онегин»": "Отношения Онегина и Ленского — это пример ложной дружбы. Они проводят время вместе от скуки, но их отношения не выдерживают испытания предрассудками. Онегин из эгоизма и мести заигрывает с Ольгой, что приводит к дуэли. Пушкин показывает, что дружба, не основанная на глубоком уважении и общих нравственных принципах, может обернуться трагедией." } },
  { section: "1", theme: "Что такое мужество?", options: ["М.А. Шолохов «Судьба человека»", "Н.В. Гоголь «Тарас Бульба»", "А.П. Чехов «Ионыч»", "М.А. Булгаков «Собачье сердце»"], correctWorks: ["М.А. Шолохов «Судьба человека»", "Н.В. Гоголь «Тарас Бульба»"], arguments: { "М.А. Шолохов «Судьба человека»": "Андрей Соколов проявляет мужество не только на поле боя, но и в плену. Когда фашисты предлагают ему выпить за победу Германии, он отказывается и выпивает за свою погибель, глядя им прямо в глаза. Его несгибаемая воля и гордость вызывают уважение даже у врагов. Этот пример показывает, что мужество — это не только физическая сила, но и сила духа, способность оставаться человеком в нечеловеческих условиях.", "Н.В. Гоголь «Тарас Бульба»": "Тарас Бульба и его сын Остап проявляют истинное мужество в бою. Остап не предает товарищей под пытками и принимает смерть с достоинством, крича: «Батько! Слышишь ли ты всё это?». Тарас, в свою очередь, не сдаваясь, продолжает борьбу до последнего вздоха. Этот пример доказывает, что мужество — это готовность идти до конца ради своей веры и Родины, не взирая на страх и боль." } },
  { section: "1", theme: "Можно ли оправдать предательство?", options: ["Н.В. Гоголь «Тарас Бульба»", "А.С. Пушкин «Капитанская дочка»", "Л.Н. Толстой «Война и мир»", "М.Ю. Лермонтов «Герой нашего времени»"], correctWorks: ["Н.В. Гоголь «Тарас Бульба»", "А.С. Пушкин «Капитанская дочка»"], arguments: { "Н.В. Гоголь «Тарас Бульба»": "Андрий предает отца, брата и Родину ради любви к прекрасной полячке. Его эгоистичное чувство оказывается сильнее товарищества и долга. Гоголь показывает, что предательство не имеет оправдания: Тарас Бульба, убивая сына, произносит: «Я тебя породил, я тебя и убью». Этот поступок доказывает, что измена Родине — это самый страшный грех, который не может быть прощен.", "А.С. Пушкин «Капитанская дочка»": "Швабрин — антипод Гринева. Оказавшись в Белогорской крепости, он из корысти и страха переходит на сторону Пугачева, забывая о присяге. Он клевещет на Машу Миронову и пытается силой принудить ее к браку. Пушкин показывает, что предательство не может быть оправдано ничем: Швабрин в итоге остается в одиночестве и казнен, а Гринев, сохранивший верность, получает прощение." } },
  { section: "1", theme: "В чём смысл человеческой жизни?", options: ["Л.Н. Толстой «Война и мир»", "А. де Сент-Экзюпери «Маленький принц»", "И.А. Гончаров «Обломов»", "А.П. Чехов «Человек в футляре»"], correctWorks: ["Л.Н. Толстой «Война и мир»", "А. де Сент-Экзюпери «Маленький принц»"], arguments: { "Л.Н. Толстой «Война и мир»": "Пьер Безухов проходит долгий путь духовных исканий. Он ищет смысл жизни в масонстве, в кутежах, в любви, но лишь встреча с Платоном Каратаевым в плену открывает ему истину. Пьер понимает, что смысл жизни — в простых человеческих ценностях: в семье, в любви, в заботе о ближнем. Этот пример доказывает, что истинное счастье не в богатстве и славе, а в гармонии с собой и окружающими.", "А. де Сент-Экзюпери «Маленький принц»": "Маленький принц отправляется в путешествие по планетам, чтобы понять мир взрослых. Он встречает короля, честолюбца, пьяницу, делового человека, фонарщика и географа, и все они кажутся ему странными. Лишь на Земле Лис открывает ему главную истину: «зорко одно лишь сердце», а смысл жизни — в любви и ответственности за тех, кого ты приручил. Этот пример показывает, что истинные ценности не видны глазу, они в душе человека." } },
  { section: "1", theme: "Что такое внутренняя красота?", options: ["А.И. Куприн «Олеся»", "А.С. Пушкин «Евгений Онегин»", "И.А. Бунин «Господин из Сан-Франциско»", "А.П. Чехов «Вишневый сад»"], correctWorks: ["А.И. Куприн «Олеся»", "А.С. Пушкин «Евгений Онегин»"], arguments: { "А.И. Куприн «Олеся»": "Олеся живет в лесу вдали от цивилизации, но ее душа чиста и прекрасна. Она способна на глубокое, бескорыстное чувство, на самопожертвование ради любимого человека. Внешне она не похожа на светских дам, но ее внутренняя красота, гармония с природой и искренность затмевают их. Этот пример доказывает, что внутренняя красота — это доброта, искренность и способность любить, а не внешний лоск.", "А.С. Пушкин «Евгений Онегин»": "Татьяна Ларина не была первой красавицей бала, но ее внутренний мир, глубина чувств и верность принципам делают ее по-настоящему прекрасной. Она выросла на народных традициях и французских романах, что сформировало ее богатый внутренний мир. Даже став светской дамой, она сохраняет верность мужу и себе. Этот пример показывает, что внутренняя красота — это богатство души и нравственная чистота." } },

  // ================= РАЗДЕЛ 2 =================
  { section: "2", theme: "Какую роль в жизни человека играет семья?", options: ["А.С. Пушкин «Капитанская дочка»", "Л.Н. Толстой «Война и мир»", "М.Ю. Лермонтов «Герой нашего времени»", "И.С. Тургенев «Отцы и дети»"], correctWorks: ["А.С. Пушкин «Капитанская дочка»", "Л.Н. Толстой «Война и мир»"], arguments: { "А.С. Пушкин «Капитанская дочка»": "Семья Гриневых заложила в Петре важные нравственные качества: понятия чести, долга и верности. Наставление отца «береги честь смолоду» стало для героя путеводной звездой, которая помогла ему не сбиться с пути даже в самых сложных жизненных ситуациях (на войне, в плену). Этот пример показывает, что крепкая семья и правильное воспитание дают человеку моральный стержень на всю жизнь.", "Л.Н. Толстой «Война и мир»": "В семье Ростовых царит атмосфера искренности, любви и взаимопонимания. Наташа Ростова выросла в этом теплом мире и впитала лучшие качества: она эмоциональна, добра и готова помочь другим. В отличие от холодных Курагиных, семья Ростовых дает своим детям нравственную основу, которая помогает им преодолевать жизненные трудности и оставаться людьми в любой ситуации." } },
  { section: "2", theme: "Почему важно помнить уроки истории?", options: ["А.С. Солженицын «Матрёнин двор»", "М.А. Шолохов «Судьба человека»", "А.С. Пушкин «Медный всадник»", "И.А. Бунин «Господин из Сан-Франциско»"], correctWorks: ["А.С. Солженицын «Матрёнин двор»", "М.А. Шолохов «Судьба человека»"], arguments: { "А.С. Солженицын «Матрёнин двор»": "Судьба Матрёны — это отражение истории русской деревни 50-х годов. Писатель показывает, что забывая о таких бескорыстных людях, как она, общество теряет свои нравственные корни. Ее жизнь была тяжелой, но она сохранила чистоту души и готовность помочь. Память о прошлом и о таких людях, как Матрёна, помогает сохранить человечность и не повторять ошибок, построенных на равнодушии.", "М.А. Шолохов «Судьба человека»": "История Андрея Соколова — это правдивый рассказ о трагедии всего народа в годы войны. Автор показывает, какие страшные испытания выпали на долю людей, как война разрушила семьи. Память о таких исторических событиях важна, чтобы будущие поколения понимали цену мира и не допустили повторения подобной трагедии. Это дань уважения всем, кто выстоял и сохранил в себе человека." } },
  { section: "2", theme: "Что помогает человеку преодолеть трудности на войне?", options: ["М.А. Шолохов «Судьба человека»", "А.Т. Твардовский «Василий Тёркин»", "В.П. Астафьев «Царь-рыба»", "М.Ю. Лермонтов «Бородино»"], correctWorks: ["М.А. Шолохов «Судьба человека»", "А.Т. Твардовский «Василий Тёркин»"], arguments: { "М.А. Шолохов «Судьба человека»": "Андрей Соколов, пройдя через ад плена и потеряв всю семью, не сломился. Его внутренняя сила, сострадание и умение оставаться человеком даже в нечеловеческих условиях помогли ему выжить. Он не сдался отчаянию и нашел новый смысл жизни, усыновив мальчика Ваню. Этот пример показывает, что на войне человека спасает не только физическая сила, но и сила духа, а также способность любить и заботиться о других.", "А.Т. Твардовский «Василий Тёркин»": "Василий Тёркин — собирательный образ простого русского солдата. Он не обладает сверхъестественными способностями, но его отличает оптимизм, смекалка и душевная простота. В любых ситуациях (будь то переправа или рукопашный бой) он сохраняет чувство юмора и веру в победу. Этот пример доказывает, что преодолеть трудности на войне помогает внутренний стержень, вера в лучшее и товарищеская поддержка." } },
  { section: "2", theme: "В чём заключается родительская любовь?", options: ["Д.И. Фонвизин «Недоросль»", "А.С. Пушкин «Капитанская дочка»", "И.С. Тургенев «Отцы и дети»", "А.Н. Островский «Гроза»"], correctWorks: ["Д.И. Фонвизин «Недоросль»", "А.С. Пушкин «Капитанская дочка»"], arguments: { "Д.И. Фонвизин «Недоросль»": "Госпожа Простакова слепо любит своего сына Митрофана. Она потакает всем его капризам, нанимает бездарных учителей и решает за него все проблемы. Однако эта любовь эгоистична и невежественна: она делает Митрофана ленивым, грубым и не приспособленным к жизни эгоистом, который в финале отрекается от матери. Этот пример показывает, что слепая родительская любовь, лишенная требовательности, может погубить личность ребенка.", "А.С. Пушкин «Капитанская дочка»": "Отец Петра Гринева, отправляя сына на военную службу, дает ему строгое наставление: «Береги платье снову, а честь смолоду». Он не балует сына, а готовит его к трудностям, воспитывая в нем чувство долга и ответственности. Эта строгая, но мудрая родительская любовь помогает Петру сохранить достоинство даже в смертельной опасности. Этот пример доказывает, что истинная любовь родителей — это воспитание характера и нравственных принципов." } },
  { section: "2", theme: "Что значит любить свою Родину?", options: ["Н.В. Гоголь «Тарас Бульба»", "Л.Н. Толстой «Война и мир»", "А.П. Чехов «Ионыч»", "М.А. Булгаков «Собачье сердце»"], correctWorks: ["Н.В. Гоголь «Тарас Бульба»", "Л.Н. Толстой «Война и мир»"], arguments: { "Н.В. Гоголь «Тарас Бульба»": "Тарас Бульба и его сыновья — пример истинного патриотизма. Они готовы отдать жизнь за свою землю и веру. Тарас, видя предательство Андрия, убивает его, а сам, попав в плен, до последнего помогает товарищам и предсказывает победу русской земли. Этот пример показывает, что любить Родину — значит ставить ее интересы выше личных, быть готовым на самопожертвование и защиту Отечества.", "Л.Н. Толстой «Война и мир»": "Истинный патриотизм в романе показан через образы простых людей и дворян. Кутузов, Болконский и простые солдаты сражаются не за награды, а за свободу своей страны. Пьер Безухов, облачившись в крестьянскую одежду, остается в Москве, чтобы убить Наполеона. Этот пример доказывает, что любовь к Родине — это не громкие слова, а конкретные поступки и готовность защищать свою землю в трудную минуту." } },
  { section: "2", theme: "Возможен ли конфликт между личностью и обществом?", options: ["А.С. Грибоедов «Горе от ума»", "М.Ю. Лермонтов «Герой нашего времени»", "А.С. Пушкин «Капитанская дочка»", "И.А. Гончаров «Обломов»"], correctWorks: ["А.С. Грибоедов «Горе от ума»", "М.Ю. Лермонтов «Герой нашего времени»"], arguments: { "А.С. Грибоедов «Горе от ума»": "Чацкий, представитель нового поколения, противостоит «фамусовскому обществу», которое живет по старым, лицемерным законам. Он обличает карьеризм, чинопочитание и невежество. Общество отвергает его и объявляет сумасшедшим. Этот пример показывает, что конфликт между личностью и обществом неизбежен, если общество консервативно, а личность стремится к свободе и правде.", "М.Ю. Лермонтов «Герой нашего времени»": "Печорин — человек незаурядного ума и таланта, но он не может найти себе места в современном ему обществе. Он разочарован в жизни, в любви и дружбе. Его конфликт с обществом проявляется в том, что он не хочет жить по законам «водяного общества» и погибает на дуэли. Этот пример доказывает, что личность, которая намного опережает свое время, обречена на одиночество и непонимание." } },
  { section: "2", theme: "Что такое преемственность поколений?", options: ["И.С. Тургенев «Отцы и дети»", "Л.Н. Толстой «Война и мир»", "А.П. Чехов «Вишневый сад»", "М.А. Шолохов «Судьба человека»"], correctWorks: ["И.С. Тургенев «Отцы и дети»", "Л.Н. Толстой «Война и мир»"], arguments: { "И.С. Тургенев «Отцы и дети»": "Конфликт между «отцами» (Кирсановыми) и «детьми» (Базаровым) — это не просто спор о нигилизме. Это разрыв связей, непонимание и отрицание опыта прошлых поколений. Базаров отрицает искусство, любовь и авторитеты, что приводит его к трагедии. Тургенев показывает, что без уважения к традициям и без диалога между поколениями невозможно гармоничное развитие.", "Л.Н. Толстой «Война и мир»": "Семья Ростовых — пример гармоничной преемственности поколений. Старшее поколение (граф и графиня) передают детям (Наташе, Николаю) любовь, доброту и патриотизм. Взрослея, дети перенимают лучшие семейные традиции. Этот пример доказывает, что преемственность — это не слепое копирование, а передача духовных ценностей и нравственных ориентиров, которые помогают человеку в жизни." } },
  { section: "2", theme: "Каким должен быть настоящий патриот?", options: ["М.А. Шолохов «Судьба человека»", "А.Т. Твардовский «Василий Тёркин»", "А.С. Пушкин «Евгений Онегин»", "Н.В. Гоголь «Мертвые души»"], correctWorks: ["М.А. Шолохов «Судьба человека»", "А.Т. Твардовский «Василий Тёркин»"], arguments: { "М.А. Шолохов «Судьба человека»": "Андрей Соколов — настоящий патриот. Он защищает Родину на фронте, а в плену остается верен своим принципам и не предает Отечество. Его патриотизм проявляется не в громких словах, а в мужестве, стойкости и готовности защищать свою землю. Этот пример показывает, что настоящий патриот — это человек, который любит свою Родину и готов на все ради ее защиты.", "А.Т. Твардовский «Василий Тёркин»": "Василий Тёркин — простой русский солдат, который олицетворяет настоящий патриотизм. Он не произносит громких речей, но каждый день сражается за свою землю, проявляя смекалку, отвагу и любовь к жизни. Его вера в победу и оптимизм помогают ему и его товарищам выжить. Этот пример доказывает, что патриотизм — это не только готовность умереть, но и готовность жить и бороться каждый день." } },

  // ================= РАЗДЕЛ 3 =================
  { section: "3", theme: "Как природа влияет на внутренний мир человека?", options: ["А.И. Куприн «Олеся»", "В.П. Астафьев «Царь-рыба»", "И.А. Бунин «Чистый понедельник»", "А.П. Чехов «Человек в футляре»"], correctWorks: ["А.И. Куприн «Олеся»", "В.П. Астафьев «Царь-рыба»"], arguments: { "А.И. Куприн «Олеся»": "Главная героиня повести выросла в лесу, вдали от цивилизации, и впитала в себя лучшие качества природы: искренность, доброту и естественность. Её душа осталась чистой и гармоничной, в отличие от людей из «цивилизованного мира», показав, как природа облагораживает человека. Олеся способна на глубокое и бескорыстное чувство, потому что выросла в гармонии с окружающим миром, и это доказывает, что природа формирует лучшие черты характера.", "В.П. Астафьев «Царь-рыба»": "В романе природа выступает как грозная и мудрая сила. Браконьер Игнатьич, поймавший огромного осетра, оказывается на грани жизни и смерти. Встреча с «царем-рыбой» заставляет его переосмыслить всю свою жизнь, вспомнить грехи и раскаяться. Этот пример показывает, что природа способна не только успокаивать, но и воспитывать человека, открывая ему глаза на его собственные ошибки и пробуждая совесть." } },
  { section: "3", theme: "В чём заключается разрушительная сила технического прогресса?", options: ["М.А. Булгаков «Собачье сердце»", "Р. Брэдбери «451 градус по Фаренгейту»", "А.С. Пушкин «Капитанская дочка»", "И.С. Тургенев «Отцы и дети»"], correctWorks: ["М.А. Булгаков «Собачье сердце»", "Р. Брэдбери «451 градус по Фаренгейту»"], arguments: { "М.А. Булгаков «Собачье сердце»": "Профессор Преображенский проводит опасный эксперимент, превращая собаку в человека. Однако технический прогресс (в данном случае медицинский) не может создать человека с моральными ценностями. Шариков становится угрозой для общества: он груб, невежественен и агрессивен. Этот пример доказывает, что научные открытия без нравственной основы могут привести к катастрофе, породив чудовищ, которые разрушают мир вокруг себя.", "Р. Брэдбери «451 градус по Фаренгейту»": "В мире будущего книги под запретом, а их сжигают. Технический прогресс привел к духовной деградации общества: люди живут в виртуальной реальности и не способны думать и чувствовать. Главный герой, пожарный Гай Монтэг, осознает ценность книг и становится изгоем. Этот пример показывает, что технический прогресс, лишенный гуманизма и культуры, ведет к потере человечности и гибели цивилизации." } },
  { section: "3", theme: "Может ли искусство изменить человека?", options: ["Н.В. Гоголь «Портрет»", "В.Г. Распутин «Уроки французского»", "И.А. Гончаров «Обломов»", "А.П. Чехов «Ионыч»"], correctWorks: ["Н.В. Гоголь «Портрет»", "В.Г. Распутин «Уроки французского»"], arguments: { "Н.В. Гоголь «Портрет»": "Талантливый художник Чартков, купив роковой портрет, поддается искушению деньгами и славой. Искусство, которое он создает ради наживы, убивает в нем истинное творческое начало, а само знакомство с шедевром вызывает в нем зависть. Он сходит с ума и уничтожает все свои лучшие работы. Этот пример показывает, что искусство может как возвысить, так и погубить душу, если человек теряет свой внутренний компас и поддается порокам.", "В.Г. Распутин «Уроки французского»": "Учительница французского Лидия Михайловна, играя с мальчиком на деньги, помогает ему выжить и не потерять веру в доброту. Она не только учит его французскому языку, но и дает уроки человечности и милосердия. Этот пример доказывает, что искусство (в данном случае педагогика как искусство) способно изменить человека к лучшему, помочь ему преодолеть трудности и сохранить чистоту души." } },
  { section: "3", theme: "Что важнее для человека: наука или искусство?", options: ["М.А. Булгаков «Мастер и Маргарита»", "Н.В. Гоголь «Портрет»", "А.С. Пушкин «Моцарт и Сальери»", "М.А. Шолохов «Судьба человека»"], correctWorks: ["М.А. Булгаков «Мастер и Маргарита»", "Н.В. Гоголь «Портрет»"], arguments: { "М.А. Булгаков «Мастер и Маргарита»": "Мастер создает роман о Понтии Пилате, вкладывая в него всю свою душу. Искусство для него — это смысл жизни, способ противостоять серой реальности и говорить правду. Даже когда его произведение не публикуют, оно остается живым в сердцах Маргариты и читателей. Этот пример показывает, что искусство — это духовный компас, который помогает человеку сохранить себя в мире прагматизма и лжи.", "Н.В. Гоголь «Портрет»": "Художник Чартков, обладающий талантом, отказывается от искусства ради денег и славы. Он пишет портреты на заказ, не вкладывая в них душу, и его талант угасает. Только осознав свою ошибку, он понимает, что настоящее искусство важнее материальных благ. Этот пример доказывает, что искусство — это не просто ремесло, а божественный дар, который требует от человека ответственности и чистоты помыслов." } },

let currentQuizPool = [], currentQuestion = null, qNumber = 1, selectedOptions = new Set();

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function startQuiz(section) {
  currentQuizPool = section === 'all' ? [...DB] : DB.filter(q => q.section === section);
  currentQuizPool.sort(() => Math.random() - 0.5);
  qNumber = 1;
  document.getElementById('q-num').textContent = qNumber;
  showScreen('screen-quiz-play');
  nextQuestion();
}

function nextQuestion() {
  if (currentQuizPool.length === 0) {
    alert('Вы прошли все темы из этого раздела! Возвращаемся в меню.');
    showScreen('screen-quiz-menu');
    return;
  }
  currentQuestion = currentQuizPool.pop();
  document.getElementById('theme-title').textContent = currentQuestion.theme;
  document.getElementById('answer-block').classList.add('hidden');
  document.getElementById('btn-next').classList.add('hidden');
  document.getElementById('btn-check').classList.add('hidden');
  const optsContainer = document.getElementById('options-container');
  optsContainer.innerHTML = '';
  selectedOptions.clear();
  
  // Перемешиваем варианты ответов
  const shuffledOpts = [...currentQuestion.options].sort(() => Math.random() - 0.5);
  
  shuffledOpts.forEach((opt, idx) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn w-full text-left px-4 py-3 rounded-xl font-medium text-gray-700 bg-white cursor-pointer mb-2';
    btn.innerHTML = `<span class="inline-block w-6 h-6 rounded-full bg-gray-100 text-gray-500 text-center text-sm leading-6 mr-2">${idx + 1}</span> ${opt}`;
    btn.onclick = () => toggleOption(opt, btn);
    optsContainer.appendChild(btn);
  });
  document.getElementById('q-num').textContent = qNumber++;
}

function toggleOption(opt, btn) {
  if (btn.disabled) return;
  if (selectedOptions.has(opt)) {
    selectedOptions.delete(opt);
    btn.classList.remove('selected');
  } else {
    if (selectedOptions.size < 2) {
      selectedOptions.add(opt);
      btn.classList.add('selected');
    }
  }
  document.getElementById('btn-check').classList.toggle('hidden', selectedOptions.size !== 2);
}

function checkAnswers() {
  document.querySelectorAll('#options-container .option-btn').forEach(btn => {
    btn.disabled = true;
    btn.classList.remove('selected');
    const optText = btn.innerText.replace(/^\d+\s*/, '').trim();
    if (currentQuestion.correctWorks.includes(optText)) btn.classList.add('correct');
    else if (selectedOptions.has(optText)) btn.classList.add('wrong');
  });
  document.getElementById('btn-check').classList.add('hidden');
  const argsContainer = document.getElementById('arguments-container');
  argsContainer.innerHTML = '';
  currentQuestion.correctWorks.forEach(work => {
    argsContainer.innerHTML += `
      <div class="bg-fuchsia-50 border border-fuchsia-200 rounded-2xl p-6 shadow-sm">
        <h3 class="text-lg font-bold text-gray-900 mb-3 border-b border-fuchsia-200 pb-2">${work}</h3>
        <p class="text-sm text-gray-700 leading-relaxed">${currentQuestion.arguments[work]}</p>
      </div>`;
  });
  document.getElementById('answer-block').classList.remove('hidden');
  document.getElementById('btn-next').classList.remove('hidden');
  setTimeout(() => document.getElementById('answer-block').scrollIntoView({ behavior: 'smooth', block: 'start' }), 100);
}

function openReference() {
  const container = document.getElementById('ref-content');
  container.innerHTML = '';
  const sections = { "1": "Духовно-нравственные ориентиры", "2": "Семья, общество, Отечество", "3": "Природа и культура" };
  for (const [secId, secName] of Object.entries(sections)) {
    const sectionItems = DB.filter(item => item.section === secId);
    let html = `<h2 class="text-xl font-bold text-fuchsia-700 mt-6 mb-4 border-b-2 border-fuchsia-200 pb-2">${secName}</h2>`;
    sectionItems.forEach(item => {
      html += `<div class="mb-6 bg-white p-4 rounded-xl shadow-sm border border-gray-100"><div class="font-bold text-gray-800 mb-3 text-lg">Тема: ${item.theme}</div>`;
      item.correctWorks.forEach(work => {
        html += `<div class="mb-4 pl-4 border-l-4 border-fuchsia-400"><div class="font-semibold text-fuchsia-600 mb-1">📖 ${work}</div><div class="text-sm text-gray-700 leading-relaxed">${item.arguments[work]}</div></div>`;
      });
      html += `</div>`;
    });
    container.innerHTML += html;
  }
  showScreen('screen-ref');
}
