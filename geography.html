<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; height: 100vh; overflow: hidden; background: #f0f4f8; }
  #map { height: 100vh; width: 100%; background: #d0d8e0; z-index: 1; }
  
  /* Скрытие экранов */
  .screen { display: none; width: 100%; height: 100%; }
  .screen.active { display: flex; flex-direction: column; }
  .screen.absolute-active { display: block; position: absolute; inset: 0; }

  /* Стили для карточек */
  .menu-card { background: #fff; padding: 20px; border-radius: 16px; text-align: center; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.05); transition: 0.2s; border: 2px solid transparent; }
  .menu-card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.1); border-color: #3b82f6; }
  
  /* Стили для квиза (Задание 9) */
  .option-btn { transition: all 0.15s ease; border: 2px solid #e5e7eb; }
  .option-btn.selected { background-color: #e0f2fe; border-color: #3b82f6; color: #1e3a8a; transform: scale(0.98); }
  .option-btn.correct { background-color: #dcfce7; border-color: #22c55e; color: #166534; pointer-events: none; }
  .option-btn.wrong { background-color: #fee2e2; border-color: #ef4444; color: #991b1b; pointer-events: none; opacity: 0.7; }
  .option-btn:disabled { cursor: not-allowed; }
</style>
</head>

<!-- ================= ЭКРАН 1: ГЛАВНОЕ МЕНЮ ГЕОГРАФИИ ================= -->
<div id="screen-main" class="screen active items-center justify-center p-4">

    <div class="flex justify-between items-center mb-4">

  </div>
</div>

// ============================================================
//  ЛОГИКА ПЕРЕКЛЮЧЕНИЯ ЭКРАНОВ
// ============================================================
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => {
    s.classList.remove('active', 'absolute-active');
    if (id === 'screen-task4-play') {
      s.style.display = 'none';
    } else {
      s.style.display = 'none';
    }
  });
  
  const target = document.getElementById(id);
  if (id === 'screen-task4-play') {
    target.style.display = 'block';
    target.classList.add('absolute-active');
  } else {
    target.style.display = 'flex';
    target.classList.add('active');
    // Если это меню с прокруткой, делаем flex-col
    if(target.classList.contains('overflow-y-auto')) {
      target.style.display = 'block';
    }
  }
}

function openTask4Menu() {
  showScreen('screen-task4-menu');
}

function openTask9Menu() {
  showScreen('screen-task9-menu');
}

let map = null;
let mapMarkers = [];
let mapAvailable = [];
let mapCurrentQ = null;
let mapCorrect = 0, mapWrong = 0, mapIsAnswered = false;
let mapCurrentRegion = 'russia';

function getMapIcon(color = 'blue') {
  const colors = {
    blue: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-blue.png',
    green: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-green.png',
    red: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png'
  };
  return L.icon({
    iconUrl: colors[color],
    shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
    iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
  });
}

function switchRegion(region) {
  mapCurrentRegion = region;
  document.getElementById('btn-reg-russia').className = region === 'russia' ? 'flex-1 py-3 bg-blue-600 text-white rounded-xl font-bold shadow' : 'flex-1 py-3 bg-white text-gray-600 rounded-xl font-bold shadow';
  document.getElementById('btn-reg-world').className = region === 'world' ? 'flex-1 py-3 bg-blue-600 text-white rounded-xl font-bold shadow' : 'flex-1 py-3 bg-white text-gray-600 rounded-xl font-bold shadow';

  const grid = document.getElementById('map-topics-grid');
  grid.innerHTML = '';
  const topics = GEO_DATA[region].topics;

  for (const [id, data] of Object.entries(topics)) {
    const card = document.createElement('div');
    card.className = 'bg-white p-4 rounded-xl text-center shadow-sm border border-gray-100 font-semibold text-gray-700 hover:bg-blue-50 transition cursor-pointer';
    card.textContent = data.name;
    card.onclick = () => startMapTopic(region, id);
    grid.appendChild(card);
  }
}

function startMapTopic(region, topicId) {
  showScreen('screen-task4-play');
  const data = GEO_DATA[region];
  const topic = data.topics[topicId];
  document.getElementById('map-topic-title').textContent = topic.name;

  if (!map) {
    map = L.map('map', { zoomControl: false }).setView(data.center, data.zoom);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);
  } else {
    map.setView(data.center, data.zoom);
    map.eachLayer(l => { if (l instanceof L.Marker) map.removeLayer(l); });
  }

  setTimeout(() => map.invalidateSize(), 200);

  mapMarkers = [];
  mapCorrect = 0; mapWrong = 0; mapIsAnswered = false; mapCurrentQ = null;
  document.getElementById('map-correct').textContent = '0';
  document.getElementById('map-wrong').textContent = '0';

  mapAvailable = Object.keys(topic.items);

  for (const [name, coords] of Object.entries(topic.items)) {
    const marker = L.marker(coords, { icon: getMapIcon('blue') }).addTo(map);
    marker.on('click', () => handleMapClick(name, marker, topic.items));
    mapMarkers.push(marker);
  }
  nextMapQ();
}

function closeMapPlay() {
  showScreen('screen-task4-menu');
}

function nextMapQ() {
  if (mapAvailable.length === 0) {
    document.getElementById('map-question').textContent = '🏁 Викторина завершена!';
    document.getElementById('map-rem').textContent = '0';
    return;
  }
  mapMarkers.forEach(m => m.setIcon(getMapIcon('blue')));
  const rand = Math.floor(Math.random() * mapAvailable.length);
  mapCurrentQ = mapAvailable[rand];
  document.getElementById('map-question').textContent = mapCurrentQ;
  document.getElementById('map-rem').textContent = mapAvailable.length;
  mapIsAnswered = false;
}

function handleMapClick(name, marker, items) {
  if (mapIsAnswered || !mapCurrentQ) return;
  const isCorrect = (name === mapCurrentQ);
  marker.setIcon(getMapIcon(isCorrect ? 'green' : 'red'));

  if (isCorrect) {
    mapCorrect++;
    document.getElementById('map-question').innerHTML = `<span class="text-green-500">✅ Верно!</span>`;
  } else {
    mapWrong++;
    document.getElementById('map-question').innerHTML = `<span class="text-red-500">❌ Это ${name}</span>`;
    const trueCoords = items[mapCurrentQ];
    const trueMarker = mapMarkers.find(m => {
      const p = m.getLatLng();
      return Math.abs(p.lat - trueCoords[0]) < 0.001 && Math.abs(p.lng - trueCoords[1]) < 0.001;
    });
    if (trueMarker) trueMarker.setIcon(getMapIcon('green'));
  }

  document.getElementById('map-correct').textContent = mapCorrect;
  document.getElementById('map-wrong').textContent = mapWrong;
  mapIsAnswered = true;

  const idx = mapAvailable.indexOf(mapCurrentQ);
  if (idx !== -1) mapAvailable.splice(idx, 1);
  document.getElementById('map-rem').textContent = mapAvailable.length;

  if (mapAvailable.length > 0) {
    setTimeout(nextMapQ, 2000);
  } else {
    document.getElementById('map-question').textContent = '🏁 Викторина завершена!';
  }
}

    { name: "Производство хлопка", correct: ["Китай", "Индия", "США", "Бразилия", "Пакистан", "Узбекистан", "Австралия"], distractors: ["Канада", "Швеция", "Норвегия", "Финляндия", "Германия", "Франция", "Испания", "Италия", "Великобритания", "Польша"] }
  ]
};

let currentQuizRegion = 'russia';
let currentIndustry = null;
let currentOptions = [];
let selectedOpts = new Set();
let correctAnswerIndices = new Set();
let q9Answered = false;

function openRefMenu() {
  showScreen('screen-task9-ref');
  switchRefTab('russia');
}

function switchRefTab(region) {
  document.getElementById('btn-ref-ru').className = region === 'russia' ? 'flex-1 py-2 rounded-lg font-bold bg-blue-600 text-white shadow' : 'flex-1 py-2 rounded-lg font-bold bg-white text-gray-600 shadow';
  document.getElementById('btn-ref-world').className = region === 'world' ? 'flex-1 py-2 rounded-lg font-bold bg-blue-600 text-white shadow' : 'flex-1 py-2 rounded-lg font-bold bg-white text-gray-600 shadow';
  
  const container = document.getElementById('ref-content');
  container.innerHTML = '';
  
  QUIZ_DB[region].forEach(item => {
    container.innerHTML += `
      <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
        <div class="bg-gray-50 px-4 py-3 border-b border-gray-100 font-bold text-gray-800">${item.name}</div>
        <div class="p-4 text-sm text-gray-700">
          ${item.correct.join(', ')}
        </div>
      </div>
    `;
  });
}

function startQuizMenu() {
  showScreen('screen-task9-play');
  startQuiz('russia');
}

function startQuiz(region) {
  currentQuizRegion = region;
  document.getElementById('btn-q9-ru').className = region === 'russia' ? 'px-3 py-1.5 rounded-lg text-sm font-bold bg-blue-600 text-white shadow' : 'px-3 py-1.5 rounded-lg text-sm font-bold bg-white text-gray-600 shadow';
  document.getElementById('btn-q9-world').className = region === 'world' ? 'px-3 py-1.5 rounded-lg text-sm font-bold bg-blue-600 text-white shadow' : 'px-3 py-1.5 rounded-lg text-sm font-bold bg-white text-gray-600 shadow';
  nextQ9();
}

function nextQ9() {
  document.getElementById('q9-btn-next').classList.add('hidden');
  document.getElementById('q9-explanation').classList.add('hidden');
  
  const pool = QUIZ_DB[currentQuizRegion];
  currentIndustry = pool[Math.floor(Math.random() * pool.length)];
  
  // Выбираем 3 правильных
  const correctPool = [...currentIndustry.correct];
  const chosenCorrect = [];
  while(chosenCorrect.length < 3 && correctPool.length > 0) {
    const idx = Math.floor(Math.random() * correctPool.length);
    chosenCorrect.push(correctPool.splice(idx, 1)[0]);
  }
  
  // Выбираем 3 неправильных
  const distPool = [...currentIndustry.distractors];
  const chosenDist = [];
  while(chosenDist.length < 3 && distPool.length > 0) {
    const idx = Math.floor(Math.random() * distPool.length);
    chosenDist.push(distPool.splice(idx, 1)[0]);
  }
  
  currentOptions = [...chosenCorrect, ...chosenDist].sort(() => Math.random() - 0.5);
  
  correctAnswerIndices = new Set();
  currentOptions.forEach((opt, i) => {
    if (chosenCorrect.includes(opt)) correctAnswerIndices.add(i);
  });
  
  selectedOpts.clear();
  q9Answered = false;
  
  document.getElementById('q9-industry').textContent = currentIndustry.name;
  const optContainer = document.getElementById('q9-options');
  optContainer.innerHTML = '';
  
  currentOptions.forEach((opt, idx) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn w-full text-left px-4 py-3 rounded-xl font-medium text-gray-700 bg-white';
    btn.innerHTML = `<span class="inline-block w-6 h-6 rounded-full bg-gray-100 text-gray-500 text-center text-sm leading-6 mr-2">${idx + 1}</span> ${opt}`;
    btn.onclick = () => toggleQ9Option(idx, btn);
    optContainer.appendChild(btn);
  });
}

function toggleQ9Option(idx, btn) {
  if (q9Answered) return;
  
  if (selectedOpts.has(idx)) {
    selectedOpts.delete(idx);
    btn.classList.remove('selected');
  } else {
    if (selectedOpts.size < 3) {
      selectedOpts.add(idx);
      btn.classList.add('selected');
    }
  }
  
  if (selectedOpts.size === 3) {
    checkQ9();
  }
}

function checkQ9() {
  q9Answered = true;
  let isAllCorrect = true;
  
  document.querySelectorAll('#q9-options .option-btn').forEach((btn, idx) => {
    btn.disabled = true;
    if (correctAnswerIndices.has(idx)) {
      btn.classList.add('correct');
      btn.classList.remove('selected');
    } else if (selectedOpts.has(idx)) {
      btn.classList.add('wrong');
      btn.classList.remove('selected');
      isAllCorrect = false;
    }
  });
  
  const expBox = document.getElementById('q9-explanation');
  if (isAllCorrect) {
    expBox.innerHTML = `<strong>Отлично!</strong> Это действительно главные центры отрасли: ${currentIndustry.name}.`;
    expBox.className = 'mt-5 p-3 bg-green-50 text-green-800 text-sm rounded-lg border border-green-200';
  } else {
    expBox.innerHTML = `<strong>Есть ошибки.</strong> Правильные ответы подсвечены зелёным. Запомни их!`;
    expBox.className = 'mt-5 p-3 bg-red-50 text-red-800 text-sm rounded-lg border border-red-200';
  }
  expBox.classList.remove('hidden');
  
  document.getElementById('q9-btn-next').classList.remove('hidden');
}

// Инициализация при загрузке
switchRegion('russia');
</script>
