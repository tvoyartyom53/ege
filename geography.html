<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Задание 27 ЕГЭ | Тренажёр</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f0f4f8; }
        .option-btn { transition: all 0.15s ease; border: 2px solid #e5e7eb; background: #fff; }
        .option-btn.selected { background-color: #e0f2fe; border-color: #3b82f6; color: #1e3a8a; }
        .option-btn.correct { background-color: #dcfce7; border-color: #22c55e; color: #166534; pointer-events: none; }
        .option-btn.wrong { background-color: #fee2e2; border-color: #ef4444; color: #991b1b; pointer-events: none; opacity: 0.7; }
        .option-btn:disabled { cursor: not-allowed; }
    </style>
</head>
<body class="min-h-screen p-4">

    <header class="bg-white shadow-sm border-b border-gray-200 mb-6">
        <div class="max-w-3xl mx-auto px-4 py-4 flex items-center justify-between">
            <a href="index.html" class="text-sm font-medium text-blue-600 hover:text-blue-800 flex items-center gap-1">
                <span>←</span> На главную
            </a>
            <h1 class="text-lg font-bold text-gray-800">Задание 27</h1>
            <div class="w-16"></div>
        </div>
    </header>

    <main class="max-w-3xl mx-auto">
        <!-- Переключатель режимов -->
        <div class="flex gap-2 mb-6">
            <button onclick="switchMode('placement')" id="btn-mode-placement" class="flex-1 py-3 bg-blue-600 text-white rounded-xl font-bold shadow border-none cursor-pointer">🏭 Факторы размещения</button>
            <button onclick="switchMode('erosion')" id="btn-mode-erosion" class="flex-1 py-3 bg-white text-gray-600 rounded-xl font-bold shadow border-none cursor-pointer">🌊 Эрозия почв</button>
        </div>

        <div id="quiz-container">
            <!-- Сюда рендерится вопрос -->
        </div>
        <button id="btn-next" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl mt-4 shadow hidden border-none cursor-pointer">
            Следующий вопрос →
        </button>
    </main>

    <script>
        // ============================================================
        // БАЗЫ ВОПРОСОВ
        // ============================================================
        
        // 1. Факторы размещения производства
        const PLACEMENT_DB = [
            {
                industry: "Выплавка первичного алюминия (например, в Братске)",
                correct: ["Энергетический", "Сырьевой"],
                explanation: "Алюминиевое производство очень энергоёмкое (требует много электроэнергии) и материалоёмкое (нужны бокситы/нефелины). Поэтому заводы строят рядом с крупными ГЭС и источниками сырья."
            },
            {
                industry: "Целлюлозно-бумажное производство (ЦБК в Архангельске)",
                correct: ["Водный", "Сырьевой", "Транспортный"],
                explanation: "Для ЦБК нужны огромные объёмы воды (водный фактор) и близость к лесным ресурсам (сырьевой). Также важна возможность вывоза готовой продукции (транспортный)."
            },
            {
                industry: "Нефтехимия (производство пластмасс в Тобольске)",
                correct: ["Сырьевой", "Водный", "Энергетический"],
                explanation: "Нефтехимия привязана к сырью (попутный газ, нефть), требует много воды для охлаждения и энергии."
            },
            {
                industry: "Чёрная металлургия (полный цикл в Магнитогорске)",
                correct: ["Сырьевой", "Топливный", "Водный", "Транспортный"],
                explanation: "Классический набор для металлургии: железная руда (сырьё), коксующийся уголь (топливо), вода для охлаждения, и выгодное транспортное положение."
            },
            {
                industry: "Автомобилестроение (сборка в Санкт-Петербурге)",
                correct: ["Потребительский", "Транспортный", "Трудовой"],
                explanation: "Автосборка ориентирована на рынки сбыта (потребительский), удобную логистику для комплектующих (транспортный) и квалифицированную рабочую силу (трудовой)."
            },
            {
                industry: "Производство калийных удобрений (Соликамск)",
                correct: ["Сырьевой"],
                explanation: "Это сырьевое производство, которое жёстко привязано к местам добычи калийных солей. Транспортировать сырьё на большие расстояния невыгодно."
            },
            {
                industry: "Тяжёлое машиностроение (Екатеринбург)",
                correct: ["Сырьевой", "Трудовой", "Потребительский"],
                explanation: "Металлургическое оборудование тяжело перевозить, поэтому заводы размещают близко к металлургическим базам (сырьё) и к потребителям (горнодобывающие предприятия)."
            },
            {
                industry: "Судостроение (Санкт-Петербург)",
                correct: ["Трудовой", "Транспортный"],
                explanation: "Судостроение требует большого количества квалифицированных рабочих (трудовой) и выхода к судоходным путям (транспортный)."
            },
            {
                industry: "Сахарная промышленность (Краснодарский край)",
                correct: ["Сырьевой", "Потребительский"],
                explanation: "Сахарная свёкла — скоропортящееся сырьё, поэтому заводы строят рядом с полями (сырьевой). Готовый сахар тоже выгодно производить ближе к потребителю."
            },
            {
                industry: "Производство микрочипов (Тайвань, Южная Корея)",
                correct: ["Наукоёмкий", "Трудовой"],
                explanation: "Это высокотехнологичное производство, требующее научных кадров (наукоёмкий) и высококвалифицированных специалистов (трудовой)."
            }
        ];

        // 2. Эрозия почв
        const EROSION_DB = [
            {
                question: "На каком участке (А или В) водная эрозия почв будет проявляться сильнее?",
                correct: ["Участок А распахан, а участок В покрыт лесом", "Участок А расположен на более крутом склоне"],
                explanation: "Водная эрозия сильнее там, где нет растительности, которая задерживает воду (распаханное поле), и где больше уклон поверхности (крутой склон)."
            },
            {
                question: "Определите, на каком из участков (1 или 2) наиболее вероятно развитие оврагов.",
                correct: ["Участок 1 имеет больший уклон поверхности", "На участке 1 отсутствует растительность (распахан)"],
                explanation: "Овраги образуются на крутых склонах при отсутствии растительности, так как потоки воды быстро размывают почву."
            },
            {
                question: "Какой из двух участков (А или В) меньше подвержен водной эрозии?",
                correct: ["Участок В покрыт травянистой растительностью", "Участок В находится на выровненной поверхности (водоразделе)"],
                explanation: "Растительность корнями скрепляет почву, а на ровной поверхности вода не стекает с большой скоростью, поэтому эрозия минимальна."
            },
            {
                question: "В каком из пунктов (1 или 2) будет наблюдаться более сильный смыв почвы?",
                correct: ["Пункт 1 расположен на склоне южной экспозиции (быстрее тает снег)", "Пункт 1 распахан, а пункт 2 занят лугом"],
                explanation: "На южном склоне снег тает быстрее, вода активнее стекает. Отсутствие растительности на распаханном поле способствует смыву."
            },
            {
                question: "На каком из участков (А или В) вероятность водной эрозии минимальна?",
                correct: ["Участок В находится в пойме реки (ровная поверхность)", "Участок В покрыт лесной растительностью"],
                explanation: "В пойме реки уклон минимален, а лесная подстилка отлично впитывает воду и предотвращает размыв."
            }
        ];

        const ALL_PLACEMENT_FACTORS = [
            "Сырьевой", "Топливный", "Энергетический", "Водный", "Трудовой", 
            "Транспортный", "Потребительский", "Наукоёмкий", "Экологический"
        ];

        // ============================================================
        // ЛОГИКА
        // ============================================================
        let currentMode = 'placement'; // 'placement' или 'erosion'
        let currentIndex = 0;
        let selectedFactors = new Set();
        let isAnswered = false;

        const container = document.getElementById('quiz-container');
        const btnNext = document.getElementById('btn-next');

        function switchMode(mode) {
            currentMode = mode;
            currentIndex = 0;
            
            // Обновляем стили кнопок
            document.getElementById('btn-mode-placement').className = mode === 'placement' 
                ? 'flex-1 py-3 bg-blue-600 text-white rounded-xl font-bold shadow border-none cursor-pointer' 
                : 'flex-1 py-3 bg-white text-gray-600 rounded-xl font-bold shadow border-none cursor-pointer';
            document.getElementById('btn-mode-erosion').className = mode === 'erosion' 
                ? 'flex-1 py-3 bg-blue-600 text-white rounded-xl font-bold shadow border-none cursor-pointer' 
                : 'flex-1 py-3 bg-white text-gray-600 rounded-xl font-bold shadow border-none cursor-pointer';
            
            renderQuestion();
        }

        function renderQuestion() {
            selectedFactors.clear();
            isAnswered = false;
            btnNext.classList.add('hidden');

            if (currentMode === 'placement') {
                renderPlacementQuestion();
            } else {
                renderErosionQuestion();
            }
        }

        function renderPlacementQuestion() {
            const q = PLACEMENT_DB[currentIndex];
            const shuffled = shuffle([...ALL_PLACEMENT_FACTORS]);

            container.innerHTML = `
                <div class="bg-white rounded-2xl shadow-lg p-6 md:p-8 mb-6">
                    <div class="text-xs uppercase tracking-wide text-gray-400 mb-2">Вопрос ${currentIndex + 1} из ${PLACEMENT_DB.length}</div>
                    <div class="text-lg md:text-xl font-semibold text-gray-900 leading-relaxed mb-6">${q.industry}</div>
                    <div class="text-xs uppercase tracking-wide text-gray-400 mb-3">Выберите факторы, которые определили размещение (минимум 2):</div>
                    <div class="space-y-3">
                        ${shuffled.map(f => `
                            <button data-factor="${f}" class="option-btn w-full text-left px-5 py-3 rounded-xl border font-medium text-gray-700">${f}</button>
                        `).join('')}
                    </div>
                    <div id="explanation" class="mt-6 p-4 bg-blue-50 border border-blue-200 rounded-xl text-sm text-blue-900 hidden"></div>
                </div>
            `;

            document.querySelectorAll('[data-factor]').forEach(btn => {
                btn.addEventListener('click', () => togglePlacementFactor(btn));
            });
        }

        function renderErosionQuestion() {
            const q = EROSION_DB[currentIndex];
            
            // Собираем все уникальные варианты ответов для этого вопроса + добавляем 1-2 ложных
            const fakeOptions = ["Участок находится в зоне многолетней мерзлоты", "Участок сложен водопроницаемыми породами"];
            const allOptions = shuffle([...q.correct, ...fakeOptions]);

            container.innerHTML = `
                <div class="bg-white rounded-2xl shadow-lg p-6 md:p-8 mb-6">
                    <div class="text-xs uppercase tracking-wide text-gray-400 mb-2">Вопрос ${currentIndex + 1} из ${EROSION_DB.length}</div>
                    <div class="text-lg md:text-xl font-semibold text-gray-900 leading-relaxed mb-6">${q.question}</div>
                    <div class="text-xs uppercase tracking-wide text-gray-400 mb-3">Выберите два верных довода:</div>
                    <div class="space-y-3">
                        ${allOptions.map(f => `
                            <button data-factor="${f}" class="option-btn w-full text-left px-5 py-3 rounded-xl border font-medium text-gray-700">${f}</button>
                        `).join('')}
                    </div>
                    <div id="explanation" class="mt-6 p-4 bg-blue-50 border border-blue-200 rounded-xl text-sm text-blue-900 hidden"></div>
                </div>
            `;

            document.querySelectorAll('[data-factor]').forEach(btn => {
                btn.addEventListener('click', () => toggleErosionFactor(btn, q));
            });
        }

        function togglePlacementFactor(btn) {
            if (isAnswered) return;
            const factor = btn.getAttribute('data-factor');
            if (selectedFactors.has(factor)) {
                selectedFactors.delete(factor);
                btn.classList.remove('selected');
            } else {
                selectedFactors.add(factor);
                btn.classList.add('selected');
            }
            if (selectedFactors.size >= 2) {
                checkPlacementAnswer();
            }
        }

        function checkPlacementAnswer() {
            isAnswered = true;
            const q = PLACEMENT_DB[currentIndex];
            const correctSet = new Set(q.correct);
            let isAllCorrect = true;

            document.querySelectorAll('[data-factor]').forEach(btn => {
                const factor = btn.getAttribute('data-factor');
                btn.disabled = true;
                if (correctSet.has(factor)) {
                    btn.classList.add('correct');
                } else if (selectedFactors.has(factor)) {
                    btn.classList.add('wrong');
                    isAllCorrect = false;
                }
            });

            const expBox = document.getElementById('explanation');
            expBox.innerHTML = `<strong>${isAllCorrect ? '✅ Верно!' : '❌ Есть ошибки.'}</strong> ${q.explanation}`;
            expBox.className = `mt-6 p-4 rounded-xl text-sm ${isAllCorrect ? 'bg-green-50 border border-green-200 text-green-800' : 'bg-red-50 border border-red-200 text-red-800'}`;
            expBox.classList.remove('hidden');
            btnNext.classList.remove('hidden');
        }

        function toggleErosionFactor(btn, q) {
            if (isAnswered) return;
            const factor = btn.getAttribute('data-factor');
            
            // В эрозии выбираем строго 2 варианта
            if (selectedFactors.has(factor)) {
                selectedFactors.delete(factor);
                btn.classList.remove('selected');
            } else {
                if (selectedFactors.size < 2) {
                    selectedFactors.add(factor);
                    btn.classList.add('selected');
                }
            }

            if (selectedFactors.size === 2) {
                checkErosionAnswer(q);
            }
        }

        function checkErosionAnswer(q) {
            isAnswered = true;
            const correctSet = new Set(q.correct);
            let isAllCorrect = true;

            document.querySelectorAll('[data-factor]').forEach(btn => {
                const factor = btn.getAttribute('data-factor');
                btn.disabled = true;
                if (correctSet.has(factor)) {
                    btn.classList.add('correct');
                } else if (selectedFactors.has(factor)) {
                    btn.classList.add('wrong');
                    isAllCorrect = false;
                }
            });

            const expBox = document.getElementById('explanation');
            expBox.innerHTML = `<strong>${isAllCorrect ? '✅ Верно!' : '❌ Есть ошибки.'}</strong> ${q.explanation}`;
            expBox.className = `mt-6 p-4 rounded-xl text-sm ${isAllCorrect ? 'bg-green-50 border border-green-200 text-green-800' : 'bg-red-50 border border-red-200 text-red-800'}`;
            expBox.classList.remove('hidden');
            btnNext.classList.remove('hidden');
        }

        function shuffle(array) {
            const a = [...array];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        btnNext.addEventListener('click', () => {
            currentIndex++;
            const db = currentMode === 'placement' ? PLACEMENT_DB : EROSION_DB;
            
            if (currentIndex >= db.length) {
                container.innerHTML = `
                    <div class="bg-white rounded-2xl shadow-lg p-8 text-center">
                        <div class="text-5xl mb-4">🎉</div>
                        <h2 class="text-2xl font-bold text-gray-900 mb-2">Вопросы пройдены!</h2>
                        <p class="text-gray-600 mb-6">Ты отлично потренировался.</p>
                        <button onclick="location.reload()" class="bg-blue-600 text-white font-bold py-3 px-6 rounded-xl">Начать заново</button>
                    </div>
                `;
                btnNext.classList.add('hidden');
            } else {
                renderQuestion();
            }
        });

        // Инициализация
        switchMode('placement');
    </script>
</body>
</html>
