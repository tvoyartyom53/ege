function makeFlashcards(raw, prefix) {
  return raw.map(([prompt, answer], i) => ({
    id: `${prefix}-${String(i + 1).padStart(3, '0')}`,
    prompt,
    answer
  }));
}
function makeChoice(raw, prefix) {
  return raw.map(([question, options, answer], i) => ({
    id: `${prefix}-${String(i + 1).padStart(3, '0')}`,
    question,
    options,
    answer
  }));
}

// ==================== ПРОГРЕСС ====================
function getProgress(subjectId, taskId) {
  try {
    const raw = localStorage.getItem(`progress:${subjectId}:${taskId}`);
    return raw ? JSON.parse(raw) : {};
  } catch { return {}; }
}
function markCard(subjectId, taskId, cardId, known) {
  const p = getProgress(subjectId, taskId);
  p[cardId] = { known, attempts: (p[cardId]?.attempts ?? 0) + 1, lastSeen: Date.now() };
  localStorage.setItem(`progress:${subjectId}:${taskId}`, JSON.stringify(p));
}
function resetProgress(subjectId, taskId) {
  localStorage.removeItem(`progress:${subjectId}:${taskId}`);
}

// ==================== УТИЛИТЫ ====================
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function getSubject(id) { return DATA.subjects.find(s => s.id === id); }
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function isChoice(card) { return Array.isArray(card.options); }

function parseRoute() {
  return (location.hash.slice(1) || '/').split('/').filter(Boolean);
}
function render() {
  const parts = parseRoute();
  const app = document.getElementById('app');
  if (parts.length === 0) return renderHome(app);
  if (parts[0] === 'stats') return renderStats(app);
  if (parts[0] === 'subject' && parts[1]) {
    if (parts[2]) return renderTask(app, parts[1], parts[2]);
    return renderSubject(app, parts[1]);
  }
  app.innerHTML = '<p class="text-gray-500">Страница не найдена</p>';
}

function renderTask(app, subjectId, taskId) {
  const subject = getSubject(subjectId);
  const task = subject?.tasks.find(t => t.id === taskId);
  if (!subject || !task) { location.hash = '#/'; return; }

  const key = `${subjectId}:${taskId}`;
  if (state.taskKey !== key) {
    state.taskKey = key;
    state.queue = shuffle(task.cards);
    state.index = 0; state.revealed = false; state.done = false; state.correct = 0;
    state.currentCardId = null; state.currentOptions = null; state.selected = null; state.showResult = false;
  }
  if (state.done) return renderDone(app, subject, task);
  const card = state.queue[state.index];
  if (isChoice(card)) return renderChoice(app, subject, task, card);
  return renderFlashcard(app, subject, task, card);
}

function renderFlashcard(app, subject, task, card) {
  const progress = getProgress(subject.id, task.id);
  const knownCount = task.cards.filter(c => progress[c.id]?.known).length;
  const pct = state.queue.length ? Math.round(state.index / state.queue.length * 100) : 0;

  app.innerHTML = `
    <a href="#/subject/${subject.id}" class="text-sm text-blue-600 hover:underline mb-4 inline-block">← К заданиям</a>
    <div class="max-w-2xl mx-auto">
      <div class="flex items-center justify-between mb-4">
        <div>
          <h1 class="text-xl font-bold text-gray-900">${esc(subject.name)} • ${esc(task.title)}</h1>
          <p class="text-sm text-gray-500">${state.index + 1} из ${state.queue.length} • изучено ${knownCount}/${task.cards.length}</p>
        </div>
        <button id="btn-reset" class="text-xs text-gray-500 hover:text-red-600 transition">Сбросить</button>
      </div>
      <div class="w-full bg-gray-200 rounded-full h-2 overflow-hidden mb-6">
        <div class="bg-blue-600 h-2 transition-all duration-300" style="width:${pct}%"></div>
      </div>
      <div class="bg-white rounded-2xl shadow-lg p-8 min-h-[320px] flex flex-col">
        <div class="text-xs uppercase tracking-wide text-gray-400 mb-3">Слово с пропусками</div>
        <div class="flashcard-word text-2xl md:text-3xl text-gray-900 text-center flex-1 flex items-center justify-center py-6 break-words">
          ${esc(card.prompt)}
        </div>
        ${!state.revealed
          ? `<button id="btn-reveal" class="mt-6 bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-xl transition">Показать ответ</button>`
          : `<div class="text-xs uppercase tracking-wide text-gray-400 mb-3 mt-4">Правильное написание</div>
             <div class="flashcard-word text-2xl md:text-3xl text-green-700 text-center mb-6 break-words">${esc(card.answer)}</div>
             <div class="grid grid-cols-2 gap-3">
               <button id="btn-no" class="bg-red-50 hover:bg-red-100 text-red-700 font-medium py-3 rounded-xl transition border border-red-200">✗ Не знаю</button>
               <button id="btn-yes" class="bg-green-50 hover:bg-green-100 text-green-700 font-medium py-3 rounded-xl transition border border-green-200">✓ Знаю</button>
             </div>`}
        <button data-neuro-context="Объясни, пожалуйста, правило для слова: ${esc(card.prompt)}. Правильный ответ: ${esc(card.answer)}"
          class="neuro-ask mt-3 text-xs text-blue-600 hover:text-blue-800 underline self-center">
          🧠 Спросить Нейротёму
        </button>
      </div>
    </div>`;

  document.getElementById('btn-reveal')?.addEventListener('click', () => { state.revealed = true; render(); });
  document.getElementById('btn-no')?.addEventListener('click', () => answerFlashcard(false, subject, task));
  document.getElementById('btn-yes')?.addEventListener('click', () => answerFlashcard(true, subject, task));
  document.getElementById('btn-reset')?.addEventListener('click', () => {
    if (confirm('Сбросить прогресс по этому заданию?')) {
      resetProgress(subject.id, task.id);
      state.taskKey = null;
      render();
    }
  });
  attachNeuroAsk();
}

function answerFlashcard(known, subject, task) {
  const card = state.queue[state.index];
  markCard(subject.id, task.id, card.id, known);
  if (known) state.correct++;
  state.revealed = false;
  if (state.index + 1 >= state.queue.length) state.done = true;
  else state.index++;
  render();
}

function renderChoice(app, subject, task, card) {
  if (state.currentCardId !== card.id) {
    state.currentCardId = card.id;
    state.currentOptions = shuffle(card.options);
    state.selected = null;
    state.showResult = false;
  }
  const progress = getProgress(subject.id, task.id);
  const knownCount = task.cards.filter(c => progress[c.id]?.known).length;
  const pct = state.queue.length ? Math.round(state.index / state.queue.length * 100) : 0;

  const optionButtons = state.currentOptions.map(opt => {
    let cls = 'bg-white hover:bg-gray-50 text-gray-900 border-gray-200';
    if (state.showResult) {
      if (opt === card.answer) cls = 'bg-green-50 text-green-800 border-green-400 font-semibold';
      else if (opt === state.selected) cls = 'bg-red-50 text-red-700 border-red-400';
      else cls = 'bg-gray-50 text-gray-400 border-gray-200';
    }
    return `<button data-opt="${esc(opt)}" ${state.showResult ? 'disabled' : ''}
      class="block w-full text-left px-5 py-3 rounded-xl border ${cls} transition">${esc(opt)}</button>`;
  }).join('');

  app.innerHTML = `
    <a href="#/subject/${subject.id}" class="text-sm text-blue-600 hover:underline mb-4 inline-block">← К заданиям</a>
    <div class="max-w-2xl mx-auto">
      <div class="flex items-center justify-between mb-4">
        <div>
          <h1 class="text-xl font-bold text-gray-900">${esc(subject.name)} • ${esc(task.title)}</h1>
          <p class="text-sm text-gray-500">${state.index + 1} из ${state.queue.length} • изучено ${knownCount}/${task.cards.length}</p>
        </div>
        <button id="btn-reset" class="text-xs text-gray-500 hover:text-red-600 transition">Сбросить</button>
      </div>
      <div class="w-full bg-gray-200 rounded-full h-2 overflow-hidden mb-6">
        <div class="bg-blue-600 h-2 transition-all duration-300" style="width:${pct}%"></div>
      </div>
      <div class="bg-white rounded-2xl shadow-lg p-8">
        <div class="text-xs uppercase tracking-wide text-gray-400 mb-3">Вопрос</div>
        <div class="text-lg md:text-xl text-gray-900 mb-6 leading-relaxed">${esc(card.question)}</div>
        <div class="text-xs uppercase tracking-wide text-gray-400 mb-3">Выбери верный вариант</div>
        <div class="grid gap-3">${optionButtons}</div>
        ${state.showResult ? `<button id="btn-next" class="mt-6 w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-xl transition">Дальше →</button>` : ''}
        <button data-neuro-context="Помоги разобраться: ${esc(card.question)}. Варианты: ${esc(card.options.join(', '))}. Правильный ответ: ${esc(card.answer)}"
          class="neuro-ask mt-3 text-xs text-blue-600 hover:text-blue-800 underline self-center block mx-auto">
          🧠 Спросить Нейротёму
        </button>
      </div>
    </div>`;

  document.querySelectorAll('[data-opt]').forEach(btn => {
    btn.addEventListener('click', () => {
      if (state.showResult) return;
      const chosen = btn.getAttribute('data-opt');
      state.selected = chosen;
      state.showResult = true;
      const isCorrect = chosen === card.answer;
      if (isCorrect) state.correct++;
      markCard(subject.id, task.id, card.id, isCorrect);
      render();
    });
  });
  document.getElementById('btn-next')?.addEventListener('click', () => {
    state.selected = null; state.showResult = false;
    state.currentCardId = null; state.currentOptions = null;
    if (state.index + 1 >= state.queue.length) state.done = true;
    else state.index++;
    render();
  });
  document.getElementById('btn-reset')?.addEventListener('click', () => {
    if (confirm('Сбросить прогресс по этому заданию?')) {
      resetProgress(subject.id, task.id);
      state.taskKey = null;
      render();
    }
  });
  attachNeuroAsk();
}

function renderDone(app, subject, task) {
  const progress = getProgress(subject.id, task.id);
  const unknownCount = task.cards.filter(c => !progress[c.id]?.known).length;
  app.innerHTML = `
    <a href="#/subject/${subject.id}" class="text-sm text-blue-600 hover:underline mb-4 inline-block">← К заданиям</a>
    <div class="max-w-2xl mx-auto">
      <div class="bg-white rounded-2xl shadow-lg p-8 text-center">
        <div class="text-5xl mb-4">🎉</div>
        <h2 class="text-2xl font-bold text-gray-900 mb-2">Круг завершён!</h2>
        <p class="text-gray-600 mb-6">Правильно: <span class="font-semibold text-green-700">${state.correct}</span> из <span class="font-semibold">${state.queue.length}</span></p>
        <div class="grid gap-3 md:grid-cols-2">
          <button id="btn-restart" class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-xl transition">Повторить всё</button>
          <button id="btn-unknown" ${unknownCount === 0 ? 'disabled' : ''} class="bg-yellow-100 hover:bg-yellow-200 disabled:opacity-40 disabled:cursor-not-allowed text-yellow-800 font-medium py-3 rounded-xl transition">Только неизученные (${unknownCount})</button>
        </div>
      </div>
    </div>`;
  document.getElementById('btn-restart').addEventListener('click', () => {
    state.queue = shuffle(task.cards);
    state.index = 0; state.revealed = false; state.done = false; state.correct = 0;
    state.currentCardId = null; state.currentOptions = null; state.selected = null; state.showResult = false;
    render();
  });
  document.getElementById('btn-unknown')?.addEventListener('click', () => {
    const unknown = task.cards.filter(c => !progress[c.id]?.known);
    if (!unknown.length) return;
    state.queue = shuffle(unknown);
    state.index = 0; state.revealed = false; state.done = false; state.correct = 0;
    state.currentCardId = null; state.currentOptions = null; state.selected = null; state.showResult = false;
    render();
  });
}

function renderStats(app) {
  app.innerHTML = `
    <h1 class="text-3xl font-bold text-gray-900 mb-2">Прогресс</h1>
    <p class="text-gray-600 mb-8">Сколько карточек ты уже знаешь по каждому заданию.</p>
    ${DATA.subjects.map(subject => `
      <section class="mb-8">
        <h2 class="text-xl font-semibold text-gray-900 mb-3">${subject.icon} ${esc(subject.name)}</h2>
        ${subject.tasks.length === 0
          ? `<p class="text-sm text-gray-500 italic">Заданий пока нет</p>`
          : `<div class="grid gap-3">
              ${subject.tasks.map(t => {
                const progress = getProgress(subject.id, t.id);
                const known = t.cards.filter(c => progress[c.id]?.known).length;
                const pct = t.cards.length ? Math.round(known / t.cards.length * 100) : 0;
                return `
                  <a href="#/subject/${subject.id}/${t.id}" class="block bg-white rounded-xl shadow-sm hover:shadow-md transition p-5 border border-gray-100">
                    <div class="flex items-center justify-between mb-2">
                      <h3 class="font-semibold text-gray-900">${esc(t.title)}</h3>
                      <span class="text-sm text-gray-500">${known}/${t.cards.length}</span>
                    </div>
                    <div class="w-full bg-gray-200 rounded-full h-2 overflow-hidden">
                      <div class="bg-blue-600 h-2 transition-all duration-300" style="width:${pct}%"></div>
                    </div>
                  </a>`;
              }).join('')}
            </div>`}
      </section>`).join('')}`;
}

// ==================== НЕЙРОТЁМА ====================
const neuro = {
  fab: null, panel: null, messagesEl: null, inputEl: null,
  fileInput: null, preview: null, thumb: null, name: null, removeBtn: null,
  currentFile: null, initialized: false
};

function initNeuro() {
  if (neuro.initialized) return;
  neuro.initialized = true;
  neuro.fab = document.getElementById('neuro-fab');
  neuro.panel = document.getElementById('neuro-panel');
  neuro.messagesEl = document.getElementById('neuro-messages');
  neuro.inputEl = document.getElementById('neuro-input');
  neuro.fileInput = document.getElementById('neuro-file-input');
  neuro.preview = document.getElementById('neuro-image-preview');
  neuro.thumb = document.getElementById('neuro-image-thumb');
  neuro.name = document.getElementById('neuro-image-name');
  neuro.removeBtn = document.getElementById('neuro-image-remove');

  neuro.fab.addEventListener('click', () => toggleNeuro());
  document.getElementById('neuro-close').addEventListener('click', () => toggleNeuro(false));

  neuro.fileInput.addEventListener('change', () => {
    const f = neuro.fileInput.files[0];
    if (!f) return;
    neuro.currentFile = f;
    neuro.thumb.src = URL.createObjectURL(f);
    neuro.name.textContent = f.name;
    neuro.preview.classList.remove('hidden');
    neuro.fileInput.value = '';
  });
  neuro.removeBtn.addEventListener('click', () => {
    neuro.currentFile = null;
    neuro.preview.classList.add('hidden');
    neuro.thumb.src = '';
  });

  document.getElementById('neuro-send').addEventListener('click', sendNeuro);
  neuro.inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendNeuro();
    }
  });
}

function toggleNeuro(show) {
  if (show === undefined) neuro.panel.classList.toggle('hidden');
  else if (show) neuro.panel.classList.remove('hidden');
  else neuro.panel.classList.add('hidden');
  if (!neuro.panel.classList.contains('hidden')) neuro.inputEl.focus();
}

function addNeuroMessage(text, role = 'user') {
  const div = document.createElement('div');
  div.className = role === 'user'
    ? 'bg-blue-100 text-blue-900 rounded-xl px-3 py-2 ml-8'
    : role === 'assistant'
      ? 'bg-white border border-gray-200 text-gray-800 rounded-xl px-3 py-2 mr-8 whitespace-pre-wrap'
      : 'text-gray-500 italic text-xs';
  div.textContent = text;
  neuro.messagesEl.appendChild(div);
  neuro.messagesEl.scrollTop = neuro.messagesEl.scrollHeight;
  return div;
}

async function sendNeuro() {
  const text = neuro.inputEl.value.trim();
  if (!text && !neuro.currentFile) return;

  const userMsg = addNeuroMessage(text || '[фото]', 'user');
  neuro.inputEl.value = '';

  if (neuro.currentFile) {
    const img = document.createElement('img');
    img.src = URL.createObjectURL(neuro.currentFile);
    img.className = 'mt-2 rounded-lg max-h-32 object-cover';
    userMsg.appendChild(img);
  }

  const fileToSend = neuro.currentFile;
  neuro.currentFile = null;
  neuro.preview.classList.add('hidden');
  neuro.thumb.src = '';

  const loading = addNeuroMessage('Нейротёма думает…', 'system');

  try {
    if (typeof puter === 'undefined') {
      throw new Error('Puter.js не загрузился. Проверь интернет и обнови страницу.');
    }

    let response;
    if (fileToSend) {
      response = await puter.ai.chat(
        text || 'Что на этом фото? Если это задание ЕГЭ — проверь, пожалуйста.',
        fileToSend,
        { model: 'gpt-4o-mini' }
      );
    } else {
      response = await puter.ai.chat(text, { model: 'gpt-4o-mini' });
    }

    loading.remove();

    let answer = '';
    if (typeof response === 'string') answer = response;
    else if (response?.message?.content) answer = response.message.content;
    else if (response?.text) answer = response.text;
    else answer = JSON.stringify(response);

    addNeuroMessage(answer, 'assistant');
  } catch (err) {
    loading.remove();
    console.error(err);
    let msg = 'Не удалось получить ответ. ';
    if (err.message && /auth|login|sign/i.test(err.message)) {
      msg += 'Похоже, нужно войти в аккаунт Puter. Попробуй отправить ещё раз — появится окно входа.';
    } else {
      msg += err.message || 'Попробуй позже.';
    }
    addNeuroMessage(msg, 'system');
  }
}

function attachNeuroAsk() {
  document.querySelectorAll('.neuro-ask').forEach(btn => {
    btn.addEventListener('click', () => {
      initNeuro();
      toggleNeuro(true);
      const ctx = btn.getAttribute('data-neuro-context') || '';
      neuro.inputEl.value = ctx;
      neuro.inputEl.focus();
    });
  });
}

// ==================== СТАРТ ====================
window.addEventListener('hashchange', () => {
  const parts = parseRoute();
  const key = parts[0] === 'subject' && parts[2] ? `${parts[1]}:${parts[2]}` : null;
  if (state.taskKey && state.taskKey !== key) state.taskKey = null;
  render();
  window.scrollTo(0, 0);
});
window.addEventListener('DOMContentLoaded', () => {
  initNeuro();
  render();
});
</script>
